<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - SocialNet</title>
    <link rel="stylesheet" href="registrarse.css">
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Encabezado -->
    <header class="header">
        <div class="header-container">
            <div class="logo-area">
                <a href="index.html" class="logo-link">
                    <img src="logoClaro.png" alt="Logo de SocialNet" class="logo-icon">
                    <span class="logo-text">SocialNet</span>
                </a>
            </div>
            <div class="auth-buttons">
                <button id="tema-boton" aria-label="Cambiar tema">☀️</button>
                <a href="index.html" class="btn btn-text">Volver al inicio</a>
            </div>
        </div>
    </header>

    <!-- Formulario de registro -->
    <main class="register-container">
        <div class="register-card">
            <h1 class="register-title">Crear cuenta</h1>
            <p class="register-subtitle">Únete a la comunidad e interactúa con tus compañeros.</p>

            <form action="/tu-servidor-o-api" method="POST" class="register-form">
                
                <div class="form-group">
                    <label for="username">Apodo</label>
                    <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="nombre.apellido@alumnos.sip" required>
                </div>

                <div class="form-group">
                    <label for="age">Edad</label>
                    <input type="number" id="age" name="age" min="10" max="20" placeholder="Tu edad" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>

                <!-- Selección de intereses -->
                <section class="grupo-interes">
                    <label class="intereses-title">Intereses (selecciona al menos 2)</label>
                    <div class="checkbox-group">
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="gaming"> Gaming</label>
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="deportes"> Deportes</label>
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="fútbol"> Fútbol</label>
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="música"> Música</label>
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="arte"> Arte</label>
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="cine"> Cine</label>
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="literatura"> Literatura</label>
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="fotografía"> Fotografía</label>
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="tecnología"> Tecnología</label>
                        <label class="intereses-recuadro"><input type="checkbox" name="interests" value="viajes"> Viajes</label>
                    </div>
                </section>

                <button id="btn-crear" type="submit" class="btn btn-primary btn-full">Crear cuenta →</button>
            </form>

            <div class="register-footer">
                <p>¿Ya tienes una cuenta? <a href="iniciarSesion.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </main>

    <!-- Pie de pagina -->
    <footer class="footer">
        <small>© 2026 Social Net — Los del Frente</small>
        <span class="final">Hecho por estudiantes, para estudiantes</span>
    </footer>

    <!-- Script del tema  -->
    <script>
        const temaBoton = document.getElementById('tema-boton');

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        temaBoton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'theme') {
                if (event.newValue === 'dark') {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
            }
        });
    </script>
    
</body>
</html>
