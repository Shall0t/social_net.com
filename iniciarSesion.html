<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SocialNet</title>
    <link rel="stylesheet" href="iniciarSesion.css">
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Encabezado -->
    <header class="header">
        <section class="header-container">
            <article class="logo-area">
                <a href="index.html" class="logo-link">
                    <img src="logoClaro.png" alt="Logo de SocialNet" class="logo-icon">
                    <span class="logo-text">SocialNet</span>
                </a>
            </article>
            
            <article class="auth-buttons">
                <button id="tema-boton" aria-label="Cambiar tema">☀️</button>
                <a href="index.html" class="btn btn-text">Volver al inicio</a>
            </article>
        </section>
    </header>

    <!-- Formulario de registro -->
    <main class="login-container">
        <section class="login-card">
            <h1 class="login-title">¡Hola de nuevo!</h1>
            <p class="login-subtitle">Ingresa a tu cuenta para conectar con tus compañeros.</p>

            <form class="login-form" onsubmit="event.preventDefault();">
                <article class="form-group">
                    <label for="email">Correo institucional o usuario</label>
                    <input type="text" id="email" placeholder="nombre.apellido@alumnos.sip" required>
                </article>

                <article class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </article>

                <article class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Recordarme
                    </label>
                    <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                </article>

                <a href="paginaPrincipal/index.html" class="btn btn-primary btn-full">Iniciar Sesión</a>
            </form>

            <article class="login-footer">
                <p>¿Aún no tienes una cuenta? <a href="registrarse.html">Regístrate aquí</a></p>
            </article>
        </section>
    </main>

    <!-- Pie de páaina -->
    <footer class="footer">
        <small>© 2026 Social Net — Los del Frente</small>
        <span class="final">Hecho por estudiantes, para estudiantes</span>
    </footer>

    <!-- Script del tema -->
    <script>
        const temaBoton = document.getElementById('tema-boton');

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        temaBoton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });
    </script>

</body>
</html>
