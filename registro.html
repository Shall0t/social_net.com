<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — Social Net</title>
  <link rel="stylesheet" href="registro.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- FORMULARIO DE REGISTRO -->
  <main class="panel-formulario">

    <a href="web_principal.html" class="boton-volver">← Volver al inicio</a>

    <h1 class="titulo-formulario">Crear cuenta</h1>
    <p class="subtitulo-formulario">
      ¿Ya tienes cuenta?
      <a href="login.html" class="enlace-sesion">Inicia sesión</a>
    </p>

    <!-- Datos personales -->
    <section class="grupo-campos">

      <p class="campo">
        <label class="etiqueta-campo" for="campo-apodo">Apodo</label>
        <input type="text" class="campo-texto" id="campo-apodo" placeholder="Ej: StarGazer22">
      </p>

      <p class="campo">
        <label class="etiqueta-campo" for="campo-correo">Correo electrónico</label>
        <input type="email" class="campo-texto" id="campo-correo" placeholder="tucorreo@colegio.cl">
      </p>

      <p class="campo">
        <label class="etiqueta-campo" for="campo-edad">Edad</label>
        <input type="number" class="campo-texto" id="campo-edad" placeholder="15" min="12" max="19">
      </p>

      <p class="campo">
        <label class="etiqueta-campo" for="campo-contrasena">Contraseña</label>
        <input type="password" class="campo-texto" id="campo-contrasena" placeholder="Mínimo 6 caracteres">
      </p>

    </section>

    <!-- Intereses -->
    <section class="grupo-intereses">
      <p class="etiqueta-campo">Intereses (elige al menos 2)</p>
      <ul class="lista-etiquetas">
        <li><span class="etiqueta-interes">🎮 Gaming</span></li>
        <li><span class="etiqueta-interes">🎵 Música</span></li>
        <li><span class="etiqueta-interes">📚 Lectura</span></li>
        <li><span class="etiqueta-interes">⚽ Fútbol</span></li>
        <li><span class="etiqueta-interes">🎨 Arte</span></li>
        <li><span class="etiqueta-interes">🎬 Cine</span></li>
        <li><span class="etiqueta-interes">🧪 Ciencias</span></li>
        <li><span class="etiqueta-interes">💻 Tecnología</span></li>
        <li><span class="etiqueta-interes">🏋️ Deportes</span></li>
        <li><span class="etiqueta-interes">🌍 Viajes</span></li>
        <li><span class="etiqueta-interes">🍕 Gastronomía</span></li>
        <li><span class="etiqueta-interes">📸 Fotografía</span></li>
      </ul>
    </section>

    <!-- Botón enviar -->
    <button class="boton-registro">Crear cuenta →</button>

  </main>

</body>
</html>
